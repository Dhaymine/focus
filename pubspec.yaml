name: focus
description: FOCUS personal productivity app for Android, Windows and iOS (reduced).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  shared_preferences: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  drift: ">=2.22.0 <2.28.0"
  sqlite3_flutter_libs: ^0.5.28
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ">=2.22.0 <2.28.0"
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
